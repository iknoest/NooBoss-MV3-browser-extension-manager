<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NooBoss - Extension Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
    }
    :root {
      --bg: #f5f6f8; --bg-secondary: #edf0f3; --bg-hover: #dfe5ec;
      --text: #1f2937; --text-secondary: #5f6878; --border: #ccd4dd;
      --primary: #3f4a5a; --primary-hover: #2d3748; --success: #3b8a65;
      --danger: #b63d3d; --warning: #b57a0f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141b24; --bg-secondary: #1d2733; --bg-hover: #2f3c4d;
        --text: #edf3f9; --text-secondary: #a9b4c2; --border: #3c4a5e;
        --primary: #dfe6f1;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
