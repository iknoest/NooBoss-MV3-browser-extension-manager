<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Wikipedia in Google Chrome</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* CHROME WINDOW HEADER & TAB STRIP */
    .chrome-header {
      background: #1e293b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      user-select: none;
    }

    .tab-strip {
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
    }

    .window-controls {
      display: flex;
      gap: 8px;
      margin-right: 12px;
    }
    .traffic-light {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .tl-red { background: #ef4444; }
    .tl-yellow { background: #f59e0b; }
    .tl-green { background: #10b981; }

    .chrome-tab {
      height: 34px;
      background: #0f172a;
      border-radius: 8px 8px 0 0;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 500;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      min-width: 220px;
      position: relative;
    }
    .tab-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      font-family: serif;
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #94a3b8;
    }
    .new-tab-btn {
      color: #94a3b8;
      font-size: 18px;
      padding: 4px 8px;
      cursor: pointer;
    }

    /* OMNIBOX & TOOLBAR */
    .toolbar {
      height: 48px;
      background: #0f172a;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-buttons {
      display: flex;
      gap: 12px;
      color: #94a3b8;
      font-size: 16px;
    }

    .omnibox {
      flex: 1;
      height: 34px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 17px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      font-size: 14px;
      color: #cbd5e1;
    }
    .omnibox .lock-icon {
      font-size: 12px;
      color: #94a3b8;
    }
    .omnibox .url-protocol {
      color: #64748b;
    }
    .omnibox .url-highlight {
      color: #38bdf8;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.15);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .omnibox .url-path {
      color: #cbd5e1;
    }

    .extensions-toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding-left: 6px;
    }
    .ext-icon-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .ext-icon-badge img {
      width: 20px;
      height: 20px;
      filter: grayscale(100%) opacity(0.65);
    }
    .ext-status {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* WEB CONTENT */
    .content-area {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }
    .content-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
    }
  </style>
</head>
<body>

  <!-- Chrome Header -->
  <div class="chrome-header">
    <div class="tab-strip">
      <div class="window-controls">
        <div class="traffic-light tl-red"></div>
        <div class="traffic-light tl-yellow"></div>
        <div class="traffic-light tl-green"></div>
      </div>
      <div class="chrome-tab">
        <div class="tab-icon">W</div>
        <span class="tab-title">Google Chrome - Wikipedia</span>
        <div class="tab-close">✕</div>
      </div>
      <div class="new-tab-btn">+</div>
    </div>

    <!-- Toolbar & Omnibox -->
    <div class="toolbar">
      <div class="nav-buttons">
        <span>←</span>
        <span>→</span>
        <span>↻</span>
      </div>
      <div class="omnibox">
        <span class="lock-icon">🔒</span>
        <span class="url-protocol">https://en.</span><span class="url-highlight">wikipedia.org</span><span class="url-path">/wiki/Google_Chrome</span>
      </div>
      <div class="extensions-toolbar">
        <div class="ext-icon-badge">
          <img src="/tmp/real-demo-extensions/darkreader/icons/dr_128.png" alt="Dark Reader" />
          <span class="ext-status">OFF</span>
        </div>
        <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;">
          <img src="chrome-extension://onkcjpfgllpfbimnchjehboikhippnka/icons/icon48.png" style="width:18px;height:18px;" onerror="this.style.display='none'" />
        </div>
      </div>
    </div>
  </div>

  <!-- Real Wikipedia Web Content -->
  <div class="content-area">
    <img src="/tmp/wiki-light-snapshot.png" alt="Wikipedia in Light Mode" />
  </div>

</body>
</html>
